name: 'RCE Kunstcollecties ETL: stateful harvest + transform' 

env:
  BASE_URI: 'https://linkeddata.cultureelerfgoed.nl/'
  ARTIFACT_PATH: 'artifact.tar.gz'
  GRAPH_ID: 'rijkscollectie-generic-graph'
  DATASET_NAME: 'rijkscollectie-rce'

on:
  workflow_dispatch: {}
    
jobs:
  harvest-and-transform:
    runs-on: ubuntu-latest 
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        export PYTHONPATH=config/
        wget -O 'lib/shexml.jar' 'https://repo1.maven.org/maven2/com/herminiogarcia/shexml_3/0.6.1/shexml_3-0.6.1.jar'
    - name: Harvest and transform 
      run: |
        python src/oai_harvester.py 
        java -jar lib/shexml.jar -m config/collections_schema.shexml -f jsonld -o data/output/kc.jsonld
        tar cvf - data/output/*.jsonld | gzip -9 - > ${{ env.ARTIFACT_PATH }}
    - name: Compress
      run: |
        tar cvf - *.jsonld | gzip -9 - > ${{ env.ARTIFACT_PATH }}  
    - name: Upload data artifact
      uses: actions/upload-artifact@v7
      with:
        name: data-artifact
        path: ${{ env.ARTIFACT_PATH }}
        overwrite: true

  push-to-triply:
    runs-on: ubuntu-latest
    needs: harvest-and-transform
    steps:
    - name: Download data artifact
      uses: actions/download-artifact@v8
      with:
          name: data-artifact
    - name: Install dependencies
      run: |
        wget 'https://static.triply.cc/cli/triplydb-linux'
        chmod +x triplydb-linux
        tar -xzvf ${{ env.ARTIFACT_PATH }}
    - name: Push changes to TriplyDB API via CLI
      run: |
        for file in *.jsonld; do ./triplydb-linux import-from-file --dataset "${{ env.DATASET_NAME }}" --token "${{ secrets.LDV_API_TOKEN }}" --account "rce" --url "https://api.linkeddata.cultureelerfgoed.nl" --default-graph-name "https://linkeddata.cultureelerfgoed.nl/rce/${{ env.DATASET_NAME }}/graphs/${{ env.GRAPH_ID }}" --mode "merge" "$file"; done
    - name: Print triply error response
      if: ${{ failure() }}
      run: |
        cat .triplydb-js.err

  sync-triply:
    runs-on: ubuntu-latest
    needs: push-to-triply
    steps:
    - name: Sync changes to TriplyDB API via cURL
      run:  |
        curl -H 'Authorization: Bearer ${{ secrets.LDV_API_TOKEN }}' -H 'Content-Type: application/json' -X POST 'https://api.linkeddata.cultureelerfgoed.nl/datasets/rce/${{ env.DATASET_NAME }}/services/${{ env.DATASET_NAME }}' -d '{"sync": "true"}'