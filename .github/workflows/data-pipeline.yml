name: 'harvest, transform, and push' 

env:
  BASE_URI: 'https://linkeddata.cultureelerfgoed.nl/'
  GRAPH_ID: 'rijkscollectie-generic-graph'
  DATASET_NAME: 'rijkscollectie-rce'

on:
  workflow_dispatch: {}
    
jobs:
  harvest-data:
    runs-on: ubuntu-latest 
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - uses: actions/cache@v6
      with:
        path: data/
        key: ${{ env.DATASET_NAME }}-data-cache-${{ github.run_attempt }}
    - name: Upgrade pip and install Python packages
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Harvest data from endpoint
      run: |
        python src/oai_harvester.py
    - name: print cache status
      run: ls -R

  transform-data:
    runs-on: ubuntu-latest
    needs: harvest-data
    steps:
    - uses: actions/checkout@v7
    - uses: actions/cache@v6
      with:
        path: data/
        key: ${{ env.DATASET_NAME }}-data-cache-${{ github.run_attempt }}
    - name: print cache status
      run: ls -R
    - uses: actions/setup-java@v5
    - name: Install ShExML
      run: |
        wget -O 'lib/shexml.jar' 'https://github.com/herminiogg/ShExML/releases/download/v0.6.1/ShExML-v0.6.1.jar'
    - name: Transform harvested data to Linked Data
      run: |
        find data/export/ -maxdepth 1 -type f | xargs -n 1 ./process_chunks.sh

  push-data:
    runs-on: ubuntu-latest
    needs: transform-data
    steps:
    - uses: actions/cache@v6
      with:
        path: data/
        key: ${{ env.DATASET_NAME }}-data-cache-${{ github.run_attempt }}
    - name: Install dependencies
      run: |
        wget 'https://static.triply.cc/cli/triplydb-linux'
        chmod +x triplydb-linux
    - name: Push changes to TriplyDB API via CLI
      run: |
        for file in *.jsonld; do ./triplydb-linux import-from-file --dataset "${{ env.DATASET_NAME }}" --token "${{ secrets.LDV_API_TOKEN }}" --account "rce" --url "https://api.linkeddata.cultureelerfgoed.nl" --default-graph-name "https://linkeddata.cultureelerfgoed.nl/rce/${{ env.DATASET_NAME }}/graphs/${{ env.GRAPH_ID }}" --mode "merge" "$file"; done
    - name: Print triply error response
      if: ${{ failure() }}
      run: |
        cat .triplydb-js.err

  sync-service:
    runs-on: ubuntu-latest
    needs: push-data
    steps:
    - name: Sync changes to TriplyDB API via cURL
      run:  |
        curl -H 'Authorization: Bearer ${{ secrets.LDV_API_TOKEN }}' -H 'Content-Type: application/json' -X POST 'https://api.linkeddata.cultureelerfgoed.nl/datasets/rce/${{ env.DATASET_NAME }}/services/${{ env.DATASET_NAME }}' -d '{"sync": "true"}'
